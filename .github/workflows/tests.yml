name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Only the light dependencies the tests need: no Whisper or torch downloads in CI.
      - name: Install test dependencies
        run: python -m pip install numpy pronouncing
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
